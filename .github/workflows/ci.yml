name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: swift test

  platforms:
    name: Build (iOS, tvOS, visionOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Build for iOS
        run: xcodebuild build -scheme SwiftCast -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build for tvOS
        run: xcodebuild build -scheme SwiftCast -destination 'generic/platform=tvOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build for visionOS
        run: xcodebuild build -scheme SwiftCast -destination 'generic/platform=visionOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
